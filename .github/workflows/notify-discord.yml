# Posts a Discord message to the game's channel on every push to main.
#
# Needs the UPDATES_DISCORD_WEBHOOK repo secret set to a plain Discord webhook
# URL (Server Settings -> Integrations -> Webhooks). We post a plain
# webhook payload ourselves rather than using Discord's /github endpoint
# so this only fires for main and we control the message.

name: notify-discord

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post push to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.UPDATES_DISCORD_WEBHOOK }}
        run: |
          # Read the event payload from disk so commit messages are never
          # interpolated into the shell (avoids injection from crafted messages).
          # List every commit in the push, newest first, one line each:
          #   **author** [`short`](url) subject
          content=$(jq -r '
            [ (.commits | reverse | .[])
              | "**\(.author.name)** [`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0])"
            ] | join("\n")
          ' "$GITHUB_EVENT_PATH")

          # Prefix with who pushed and where.
          header="**${{ github.event.pusher.name }}** pushed to \`main\`"

          jq -n \
            --arg content "$header"$'\n'"$content" \
            '{content: $content}' \
          | curl -sf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
