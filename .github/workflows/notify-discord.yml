# Posts a Discord message to the game's channel on every push to main.
#
# Needs the UPDATES_DISCORD_WEBHOOK repo secret set to a plain Discord webhook
# URL (Server Settings -> Integrations -> Webhooks). We post a plain
# webhook payload ourselves rather than using Discord's /github endpoint
# so this only fires for main and we control the message.

name: notify-discord

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post push to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.UPDATES_DISCORD_WEBHOOK }}
        run: |
          author="${{ github.event.head_commit.author.name }}"
          message="${{ github.event.head_commit.message }}"
          # first line of the commit message only
          subject="${message%%$'\n'*}"
          url="${{ github.event.head_commit.url }}"
          sha="${{ github.sha }}"
          short="${sha:0:7}"

          jq -n \
            --arg content "**$author** pushed to \`main\`: [\`$short\`]($url) $subject" \
            '{content: $content}' \
          | curl -sf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
